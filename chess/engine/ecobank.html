<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ecobank Schools Team Chess Championship 2026</title>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #004a8f; font-size: 24px; }
        .screen { display: none; }
        .active-screen { display: block; }
        select, input, button { padding: 10px; margin: 10px 0; width: 80%; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { background-color: #004a8f; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #003366; }
        #board { width: 100%; margin: 20px auto; }
        .player-info { display: flex; justify-content: space-between; font-weight: bold; margin: 10px 0; padding: 10px; background: #e9ecef; border-radius: 5px; }
        .timer { font-family: monospace; font-size: 20px; color: #d9534f; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background-color: #004a8f; color: white; }
        .highlight { background-color: #d1ecf1; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>Ecobank Schools Team Chess Championship 2026</h1>
    
    <div id="login-screen" class="screen active-screen">
        <h3>Player Login</h3>
        <select id="player-select">
            <option value="" disabled selected>Select your name...</option>
            <option value="Obi Chukwuemeka">Obi Chukwuemeka</option>
            <option value="Onele Chierika">Onele Chierika</option>
            <option value="Semilore Beckley">Semilore Beckley</option>
            <option value="Ajayi Oluwaseun">Ajayi Oluwaseun</option>
            <option value="Andrew Nwagbale">Andrew Nwagbale</option>
            <option value="Eliana Lawrence">Eliana Lawrence</option>
            <option value="Sage Osafile">Sage Osafile</option>
        </select>
        <input type="password" id="password" placeholder="Enter Tournament Password">
        <button onclick="login()">Login to Tournament</button>
        <p id="login-error" style="color: red; display: none;">Incorrect password or missing name!</p>
    </div>

    <div id="searching-screen" class="screen">
        <h3 id="round-title">Round 1</h3>
        <p>Stand by while searching for your opponent...</p>
        <p style="color: #666; font-style: italic;">Connecting to Ecobank servers in Lagos...</p>
        <h2 id="search-timer">02:00</h2>
    </div>

    <div id="game-screen" class="screen">
        <h3 id="game-round-title">Round 1</h3>
        <div class="player-info">
            <span id="opp-name">Opponent</span>
            <span class="timer" id="opp-timer">10:00</span>
        </div>
        <div id="board"></div>
        <div class="player-info">
            <span id="my-name">My Player</span>
            <span class="timer" id="my-timer">10:00</span>
        </div>
        <p id="game-status" style="font-weight: bold; color: #004a8f;"></p>
        
        <div id="post-game-controls" style="display: none;">
            <button onclick="showStandings()">Show School Position</button>
            <button id="next-round-btn" onclick="startSearch()">Proceed to Next Round</button>
        </div>
    </div>

    <div id="standings-screen" class="screen">
        <h3>Current Standings (After Round <span id="standings-round"></span>)</h3>
        <table>
            <thead>
                <tr><th>Pos</th><th>School</th><th>Points</th></tr>
            </thead>
            <tbody id="standings-body"></tbody>
        </table>
        <button onclick="returnToGame()">Back</button>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>

<script>
    // Tournament Data
    const schools = ["Corona School", "Grange School", "Chrisland", "Greensprings", "Lekki British", "Meadow Hall", "Day Waterman", "Atlantic Hall", "Dowen College", "CIS Lagos", "St. Saviours"];
    const oppNames = ["Chinedu", "Tolu", "Aisha", "Femi", "Zainab", "Emeka", "Bisi", "Damilola", "Ibrahim", "Nneka"];
    
    let currentRound = 1;
    const maxRounds = 6;
    let playerName = "";
    let opponentName = "";
    let opponentSchool = "";
    
    // Chess Logic
    let board = null;
    let game = new Chess();
    let worker = new Worker('worker.js');
    let engineTime = 1000; // 1 second engine think time
    
    // Clocks (10 minutes = 600 seconds)
    let myTime = 600;
    let oppTime = 600;
    let timerInterval = null;
    let isMyTurn = true;

    // Initialize Engine
    worker.onmessage = function(event) {
        let line = event.data;
        if (line.indexOf("move ") === 0) {
            let moveStr = line.substring(5); // e.g., e2e4
            let source = moveStr.substring(0, 2);
            let target = moveStr.substring(2, 4);
            let promotion = moveStr.length > 4 ? moveStr.charAt(4) : 'q';
            
            game.move({ from: source, to: target, promotion: promotion });
            board.position(game.fen());
            
            isMyTurn = true;
            checkStatus();
        }
    };

    function login() {
        playerName = document.getElementById('player-select').value;
        let pwd = document.getElementById('password').value;
        if (playerName && pwd === "decipherchess") {
            document.getElementById('my-name').innerText = playerName;
            startSearch();
        } else {
            document.getElementById('login-error').style.display = 'block';
        }
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
        document.getElementById(screenId).classList.add('active-screen');
    }

    function startSearch() {
        if(currentRound > maxRounds) {
            alert("The tournament is over! Please check the final standings.");
            showStandings();
            return;
        }

        switchScreen('searching-screen');
        document.getElementById('round-title').innerText = "Round " + currentRound;
        
        // 2 Minutes (120 seconds) search simulation
        let waitTime = 120; 
        document.getElementById('search-timer').innerText = "02:00";
        
        let searchInterval = setInterval(() => {
            waitTime--;
            let mins = Math.floor(waitTime / 60).toString().padStart(2, '0');
            let secs = (waitTime % 60).toString().padStart(2, '0');
            document.getElementById('search-timer').innerText = `${mins}:${secs}`;
            
            if (waitTime <= 0) {
                clearInterval(searchInterval);
                startRound();
            }
        }, 1000);
    }

    function startRound() {
        opponentName = oppNames[Math.floor(Math.random() * oppNames.length)];
        opponentSchool = schools[Math.floor(Math.random() * schools.length)];
        document.getElementById('opp-name').innerText = `${opponentName} (${opponentSchool})`;
        document.getElementById('game-round-title').innerText = `Round ${currentRound}`;
        
        // Reset Board & Clocks
        game.reset();
        board.start();
        myTime = 600;
        oppTime = 600;
        isMyTurn = true;
        updateClocks();
        
        document.getElementById('post-game-controls').style.display = 'none';
        document.getElementById('game-status').innerText = "";
        
        // Ensure player is always white for simplicity of simulation
        board.orientation('white');
        
        switchScreen('game-screen');
        
        clearInterval(timerInterval);
        timerInterval = setInterval(tickClocks, 1000);
    }

    function tickClocks() {
        if (game.game_over()) return;
        
        if (isMyTurn) myTime--;
        else oppTime--;
        
        updateClocks();
        
        if (myTime <= 0 || oppTime <= 0) {
            clearInterval(timerInterval);
            document.getElementById('game-status').innerText = "Flag fell. Game Over!";
            showPostGame();
        }
    }

    function updateClocks() {
        document.getElementById('my-timer').innerText = formatTime(myTime);
        document.getElementById('opp-timer').innerText = formatTime(oppTime);
    }

    function formatTime(seconds) {
        let m = Math.floor(seconds / 60).toString().padStart(2, '0');
        let s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    // Chessboard Handlers
    function onDragStart(source, piece) {
        if (game.game_over() || !isMyTurn || myTime <= 0) return false;
        if (piece.search(/^b/) !== -1) return false; // Only move white
    }

    function onDrop(source, target) {
        let move = game.move({
            from: source,
            to: target,
            promotion: 'q' // Auto promote to queen for simplicity
        });

        if (move === null) return 'snapback';

        isMyTurn = false;
        checkStatus();

        if (!game.game_over()) {
            worker.postMessage("position " + game.fen());
            worker.postMessage("search " + engineTime);
        }
    }

    function onSnapEnd() {
        board.position(game.fen());
    }

    function checkStatus() {
        if (game.game_over()) {
            clearInterval(timerInterval);
            if (game.in_checkmate()) document.getElementById('game-status').innerText = "Checkmate! Game Over.";
            else if (game.in_draw()) document.getElementById('game-status').innerText = "Draw!";
            else document.getElementById('game-status').innerText = "Game Over!";
            showPostGame();
        }
    }

    function showPostGame() {
        document.getElementById('post-game-controls').style.display = 'block';
        if (currentRound >= maxRounds) {
            document.getElementById('next-round-btn').style.display = 'none'; // Hide next round if done
        }
    }

    function showStandings() {
        switchScreen('standings-screen');
        document.getElementById('standings-round').innerText = currentRound;
        
        let allSchools = [...schools, "Maryland Convent Private School"];
        let standings = [];
        
        if (currentRound === maxRounds) {
            // Guarantee exactly 8th position at the end
            standings = [
                { s: "Corona School", p: 5.5 }, { s: "Grange School", p: 5.0 }, { s: "Chrisland", p: 4.5 },
                { s: "Lekki British", p: 4.5 }, { s: "Greensprings", p: 4.0 }, { s: "Meadow Hall", p: 4.0 },
                { s: "CIS Lagos", p: 3.5 }, { s: "Maryland Convent Private School", p: 3.5 },
                { s: "St. Saviours", p: 3.0 }, { s: "Day Waterman", p: 2.5 }, { s: "Atlantic Hall", p: 2.0 },
                { s: "Dowen College", p: 1.0 }
            ];
        } else {
            // Random realistic standings for earlier rounds
            allSchools.forEach(sch => {
                standings.push({ s: sch, p: (Math.random() * currentRound).toFixed(1) });
            });
            standings.sort((a, b) => b.p - a.p);
        }

        let tbody = "";
        standings.forEach((row, index) => {
            let isMCPS = row.s === "Maryland Convent Private School";
            tbody += `<tr class="${isMCPS ? 'highlight' : ''}">
                <td>${index + 1}</td>
                <td>${row.s}</td>
                <td>${row.p}</td>
            </tr>`;
        });
        document.getElementById('standings-body').innerHTML = tbody;
        
        if(currentRound < maxRounds) currentRound++;
    }

    function returnToGame() {
        if (currentRound > maxRounds) {
            alert("Tournament concluded. Thank you for playing!");
        } else {
            switchScreen('game-screen');
        }
    }

    // Initialize Board
    board = Chessboard('board', {
        draggable: true,
        position: 'start',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
    });
</script>
</body>
</html>
