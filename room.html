<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Decipher Live Room</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src='https://meet.jit.si/external_api.js'></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { 
            background-color: #020617; 
            color: white; 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        #board-wrapper {
            width: 90vw;
            max-width: 400px;
            margin: 0 auto;
        }
        .overlay-screen {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }
        .hidden-screen { display: none !important; }
        
        /* Standard Form Styling */
        .form-group { text-align: left; width: 100%; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        input { color: black; border-radius: 8px; padding: 12px; width: 100%; border: 2px solid #1e293b; outline: none; }
        input:focus { border-color: #eab308; }
    </style>
</head>
<body class="p-4">

    <div id="register-screen" class="overlay-screen">
        <img src="Screenshot_20260319-202756.jpg" class="w-20 h-20 rounded-full border-2 border-yellow-500 mb-4 object-cover">
        <h2 class="text-2xl font-black text-yellow-500 mb-2">STUDENT REGISTRATION</h2>
        <p class="text-slate-400 mb-6 text-sm">Please register to receive the class password.</p>
        
        <div class="w-full max-w-sm bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" placeholder="Enter student's name">
            </div>
            <div class="form-group">
                <label>School Name</label>
                <input type="text" id="reg-school" placeholder="Enter school">
            </div>
            <div class="form-group">
                <label>Class</label>
                <input type="text" id="reg-class" placeholder="e.g. Grade 5">
            </div>
            <div class="form-group">
                <label>Parent's WhatsApp Number</label>
                <input type="tel" id="reg-whatsapp" placeholder="080 0000 0000">
            </div>
            <button onclick="handleRegistration()" class="w-full bg-yellow-500 text-black py-4 rounded-xl font-bold uppercase tracking-wider hover:bg-yellow-400 transition-all">Submit & Register</button>
        </div>
    </div>

    <div id="success-screen" class="overlay-screen hidden-screen">
        <div class="bg-green-500/10 p-8 rounded-full mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        <h2 class="text-2xl font-bold mb-2">Registration Received!</h2>
        <p class="text-slate-400 max-w-xs mb-8">The password to the chess room will be sent to your WhatsApp number shortly.</p>
        <button onclick="showScreen('login-screen')" class="w-full max-w-xs bg-slate-800 py-4 rounded-xl font-bold">Go to Login Page</button>
    </div>

    <div id="login-screen" class="overlay-screen hidden-screen">
        <h2 class="text-xl font-bold text-yellow-500 mb-4 uppercase tracking-widest">Enter Class Password</h2>
        <div class="w-full max-w-xs">
            <input type="password" id="room-pass" placeholder="••••••••" class="text-center text-2xl tracking-widest">
            <button onclick="checkAccess()" class="w-full bg-blue-600 py-4 rounded-xl font-bold mt-4 mb-6">ENTER LIVE ROOM</button>
            <div class="border-t border-slate-800 pt-4">
                <button onclick="adminLogin()" class="text-xs text-slate-500 hover:text-yellow-500 uppercase font-bold tracking-tighter">Admin Portal</button>
            </div>
        </div>
    </div>

    <div id="admin-screen" class="overlay-screen hidden-screen" style="justify-content: start;">
        <div class="flex justify-between w-full mb-4 sticky top-0 bg-[#020617] py-2">
            <h2 class="text-xl font-bold text-yellow-500">Database</h2>
            <button onclick="showScreen('login-screen')" class="text-red-500 font-bold">Exit</button>
        </div>
        <div id="admin-list" class="w-full text-left space-y-3">
            <p>Loading database...</p>
        </div>
    </div>

    <div id="main-app" class="hidden-screen">
        <div class="flex items-center justify-between mb-4">
            <img src="Screenshot_20260319-202756.jpg" class="w-16 h-16 rounded-full border-2 border-yellow-500 object-cover">
            <div class="text-right">
                <h1 class="text-sm font-black uppercase text-yellow-500">Live Academy</h1>
                <p class="text-[10px] text-slate-400">Audio: <span id="status" class="text-green-500 animate-pulse">Connected</span></p>
            </div>
        </div>
        <div id="board-wrapper">
            <div id="myBoard" class="shadow-2xl border-2 border-slate-700"></div>
        </div>
        <div class="flex gap-2 mt-4 max-w-[400px] mx-auto w-full">
            <button id="startBtn" class="flex-1 bg-blue-600 py-3 rounded-xl font-bold text-xs">Reset</button>
            <button id="clearBtn" class="flex-1 bg-red-600 py-3 rounded-xl font-bold text-xs">Clear</button>
        </div>
        <div id="voice-container" class="mt-4 h-32 w-full max-w-[400px] mx-auto rounded-2xl overflow-hidden border border-slate-800"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // REPLACE WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showScreen = (screenId) => {
            $(".overlay-screen, #main-app").addClass("hidden-screen");
            $("#" + screenId).removeClass("hidden-screen");
        }

        window.handleRegistration = async () => {
            const data = {
                name: $("#reg-name").val(),
                school: $("#reg-school").val(),
                class: $("#reg-class").val(),
                whatsapp: $("#reg-whatsapp").val(),
                date: new Date().toLocaleString()
            };

            if(!data.name || !data.whatsapp || !data.school) return alert("Please fill in all details");

            try {
                await addDoc(collection(db, "registrations"), data);
                showScreen('success-screen');
            } catch (e) {
                alert("Error: " + e.message);
            }
        }

        window.checkAccess = () => {
            const pass = $("#room-pass").val();
            if(pass === "chess2026") {
                showScreen('main-app');
                initChess();
            } else {
                alert("Invalid Password. Please check the code sent to your WhatsApp.");
            }
        }

        window.adminLogin = async () => {
            const code = prompt("Enter Admin Passcode:");
            if(code === "decipher1234") {
                showScreen('admin-screen');
                const querySnapshot = await getDocs(collection(db, "registrations"));
                let html = "";
                querySnapshot.forEach((doc) => {
                    const user = doc.data();
                    html += `
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                        <div class="text-yellow-500 font-bold">${user.name}</div>
                        <div class="text-xs text-slate-400">Class: ${user.class} | School: ${user.school}</div>
                        <div class="text-xs text-blue-400 font-mono mt-1">WhatsApp: ${user.whatsapp}</div>
                        <div class="text-[9px] text-slate-600 mt-1">${user.date}</div>
                    </div>`;
                });
                $("#admin-list").html(html || "<p class='text-center'>No registrations found.</p>");
            } else if (code !== null) {
                alert("Access Denied.");
            }
        }

        function initChess() {
            var board = Chessboard('myBoard', {
                draggable: true,
                dropOffBoard: 'trash',
                sparePieces: true,
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
            $('#startBtn').on('click', board.start);
            $('#clearBtn').on('click', board.clear);
            $(window).resize(board.resize);

            const domain = 'meet.jit.si';
            const options = {
                roomName: 'DecipherRoom_Private_2026',
                width: '100%',
                height: '100%',
                parentNode: document.querySelector('#voice-container'),
                configOverwrite: { startWithVideoMuted: true },
                interfaceConfigOverwrite: { TOOLBAR_BUTTONS: ['microphone'] }
            };
            new JitsiMeetExternalAPI(domain, options);
        }
    </script>
</body>
</html>
