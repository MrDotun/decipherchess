<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Decipher Live Room</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src='https://meet.jit.si/external_api.js'></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { 
            background-color: #020617; 
            color: white; 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        .overlay-screen {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.95);
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .hidden-screen { display: none !important; }
        
        .form-group { text-align: left; width: 100%; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.05em; }
        
        input { 
            background-color: #ffffff !important; 
            color: #000000 !important; 
            border-radius: 8px; 
            padding: 12px; 
            width: 100%; 
            border: 2px solid #1e293b; 
            outline: none;
            font-size: 16px;
        }
        
        input:focus { border-color: #eab308; }

        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.26, 0.53, 0.74, 1.48);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="p-4">

    <div id="register-screen" class="overlay-screen">
        <img src="Screenshot_20260319-202756.jpg" class="w-20 h-20 rounded-full border-2 border-yellow-500 mb-4 object-cover shadow-lg shadow-yellow-500/20">
        <h2 class="text-2xl font-black text-yellow-500 mb-1">DECIPHER LIVE ROOM</h2>
        <p class="text-slate-400 mb-6 text-sm">Please provide your details to enter.</p>
        
        <div class="w-full max-w-sm bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-2xl">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="reg-name" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label>School Name *</label>
                <input type="text" id="reg-school" placeholder="Enter your school" required>
            </div>
            <div class="form-group">
                <label>Class *</label>
                <input type="text" id="reg-class" placeholder="e.g. Grade 5" required>
            </div>
            <div class="form-group">
                <label>Parent's WhatsApp Number *</label>
                <input type="tel" id="reg-whatsapp" placeholder="Required for contact" required>
            </div>
            <button onclick="handleRegistration()" class="w-full bg-yellow-500 text-black py-4 rounded-xl font-bold uppercase tracking-wider hover:bg-yellow-400 active:scale-95 transition-all">Enter Live Room</button>
            
            <div class="mt-6 pt-4 border-t border-slate-800">
                <button onclick="adminLogin()" class="w-full py-2 text-xs text-slate-500 hover:text-yellow-500 uppercase font-bold tracking-widest transition-colors">
                    — Admin Portal —
                </button>
            </div>
        </div>
    </div>

    <div id="success-screen" class="overlay-screen hidden-screen">
        <div class="pop-in bg-slate-900 p-8 rounded-3xl border-2 border-yellow-500/30 shadow-2xl max-w-sm w-full">
            <div class="w-20 h-20 bg-green-500/10 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6 border border-green-500/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-white mb-3">Registration Successful!</h2>
            <p class="text-slate-400 mb-8 leading-relaxed">Thank you for your response, we'll get back to you shortly.</p>
            <button onclick="window.location.href='room.html'" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-xl font-bold text-lg shadow-lg shadow-blue-600/20 transition-all">
                Proceed to Room
            </button>
        </div>
    </div>

    <div id="admin-screen" class="overlay-screen hidden-screen" style="justify-content: start; overflow-y: auto;">
        <div class="w-full max-w-2xl">
            <div class="flex justify-between items-center w-full mb-6 sticky top-0 bg-[#020617]/90 backdrop-blur py-4 z-10 border-b border-slate-800">
                <h2 class="text-xl font-bold text-yellow-500">Registration Database</h2>
                <button onclick="showScreen('register-screen')" class="bg-red-500/10 text-red-500 px-4 py-1 rounded-full text-sm font-bold">Exit</button>
            </div>
            <div id="admin-list" class="w-full text-left space-y-3 pb-10">
                <p class="text-slate-500 italic text-center">Loading database...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Explicitly attach to window so HTML onclick can find them
        window.showScreen = (screenId) => {
            $(".overlay-screen").addClass("hidden-screen");
            $("#" + screenId).removeClass("hidden-screen");
        };

        window.handleRegistration = async () => {
            const name = $("#reg-name").val().trim();
            const school = $("#reg-school").val().trim();
            const className = $("#reg-class").val().trim();
            const whatsapp = $("#reg-whatsapp").val().trim();

            if (!name || !school || !className || !whatsapp) {
                alert("Please fill in all fields.");
                return;
            }

            const userData = {
                name, school, class: className, whatsapp,
                date: new Date().toLocaleString()
            };

            try {
                // Show the popup IMMEDIATELY before waiting for Firebase
                window.showScreen('success-screen');
                
                // Then save in background
                await addDoc(collection(db, "registrations"), userData);
            } catch (e) {
                console.error("Firebase Error: ", e);
                // If it fails, the popup is already showing so user isn't stuck
            }
        };

        window.deleteEntry = async (docId) => {
            if (confirm("Delete this registration?")) {
                try {
                    await deleteDoc(doc(db, "registrations", docId));
                    fetchAdminData();
                } catch (err) { alert("Error deleting."); }
            }
        };

        window.fetchAdminData = async () => {
            try {
                const querySnapshot = await getDocs(collection(db, "registrations"));
                let html = "";
                querySnapshot.forEach((document) => {
                    const user = document.data();
                    html += `
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 mb-3">
                        <div class="flex justify-between">
                            <div class="text-yellow-500 font-bold">${user.name}</div>
                            <button onclick="deleteEntry('${document.id}')" class="text-red-500 text-xs font-bold">DELETE</button>
                        </div>
                        <div class="text-xs text-slate-400 mt-1">${user.school} | ${user.class}</div>
                        <div class="text-xs text-blue-400 mt-1">WhatsApp: ${user.whatsapp}</div>
                    </div>`;
                });
                $("#admin-list").html(html || "<p class='text-center'>No data.</p>");
            } catch (err) { $("#admin-list").html("<p class='text-red-500'>Error.</p>"); }
        };

        window.adminLogin = () => {
            const code = prompt("Passcode:");
            if(code === "decipher1234") {
                window.showScreen('admin-screen');
                window.fetchAdminData();
            } else if (code !== null) { alert("Denied."); }
        };
    </script>
</body>
</html>
