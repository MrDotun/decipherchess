<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Decipher Live Room</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src='https://meet.jit.si/external_api.js'></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { 
            background-color: #020617; 
            color: white; 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        #board-wrapper {
            width: 90vw;
            max-width: 400px;
            margin: 0 auto;
        }
        .overlay-screen {
            position: fixed;
            inset: 0;
            background: #020617;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            overflow-y: auto;
        }
        .hidden-screen { display: none !important; }
        
        .form-group { text-align: left; width: 100%; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        
        input { 
            background-color: #ffffff !important; 
            color: #000000 !important; 
            border-radius: 8px; 
            padding: 12px; 
            width: 100%; 
            border: 2px solid #1e293b; 
            outline: none;
            -webkit-appearance: none; 
        }
        
        input:focus { 
            border-color: #eab308; 
            background-color: #ffffff !important;
            color: #000000 !important;
        }

        input::placeholder {
            color: #64748b !important;
            opacity: 1;
        }
    </style>
</head>
<body class="p-4">

    <div id="register-screen" class="overlay-screen">
        <img src="Screenshot_20260319-202756.jpg" class="w-20 h-20 rounded-full border-2 border-yellow-500 mb-4 object-cover">
        <h2 class="text-2xl font-black text-yellow-500 mb-2">DECIPHER LIVE ROOM</h2>
        <p class="text-slate-400 mb-6 text-sm">Welcome! Click the button below to join the class.</p>
        
        <div class="w-full max-w-sm bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" placeholder="Enter name (Optional)">
            </div>
            <div class="form-group">
                <label>School Name</label>
                <input type="text" id="reg-school" placeholder="Enter school (Optional)">
            </div>
            <div class="form-group">
                <label>Class</label>
                <input type="text" id="reg-class" placeholder="e.g. Grade 5 (Optional)">
            </div>
            <div class="form-group">
                <label>Parent's WhatsApp Number</label>
                <input type="tel" id="reg-whatsapp" placeholder="Optional">
            </div>
            <button onclick="handleRegistration()" class="w-full bg-yellow-500 text-black py-4 rounded-xl font-bold uppercase tracking-wider hover:bg-yellow-400 transition-all">Enter Live Room</button>
            
            <div class="mt-6 pt-4 border-t border-slate-800">
                <button onclick="adminLogin()" class="text-xs text-slate-500 hover:text-yellow-500 uppercase font-bold tracking-tighter">Admin Portal</button>
            </div>
        </div>
    </div>

    <div id="success-screen" class="overlay-screen hidden-screen">
        <div class="bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-xl max-w-sm w-full">
            <div class="w-16 h-16 bg-green-500/20 text-green-500 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h2 class="text-xl font-bold text-white mb-2">Registration Successful</h2>
            <p class="text-slate-400 mb-6">Thank you for your response, we'll get back to you shortly.</p>
            <button onclick="window.location.href='room.html'" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold">Proceed to Room</button>
        </div>
    </div>

    <div id="login-screen" class="overlay-screen hidden-screen">
        <h2 class="text-xl font-bold text-yellow-500 mb-4 uppercase tracking-widest">Enter Class Password</h2>
        <div class="w-full max-w-xs">
            <input type="text" id="room-pass" placeholder="Enter Room Code" class="text-center text-2xl tracking-widest">
            <button onclick="checkAccess()" class="w-full bg-blue-600 py-4 rounded-xl font-bold mt-4 mb-6">ENTER LIVE ROOM</button>
            <div class="flex justify-between border-t border-slate-800 pt-4">
                <button onclick="showScreen('register-screen')" class="text-xs text-slate-500 hover:text-white">Back</button>
                <button onclick="adminLogin()" class="text-xs text-slate-500 hover:text-yellow-500 uppercase font-bold tracking-tighter">Admin Portal</button>
            </div>
        </div>
    </div>

    <div id="admin-screen" class="overlay-screen hidden-screen" style="justify-content: start;">
        <div class="flex justify-between w-full mb-4 sticky top-0 bg-[#020617] py-2">
            <h2 class="text-xl font-bold text-yellow-500">Registration Database</h2>
            <button onclick="showScreen('register-screen')" class="text-red-500 font-bold">Exit</button>
        </div>
        <div id="admin-list" class="w-full text-left space-y-3">
            <p>Loading database...</p>
        </div>
    </div>

    <div id="main-app" class="hidden-screen"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.showScreen = (screenId) => {
            $(".overlay-screen, #main-app").addClass("hidden-screen");
            $("#" + screenId).removeClass("hidden-screen");
        }

        window.handleRegistration = async () => {
            const userData = {
                name: $("#reg-name").val() || "Anonymous",
                school: $("#reg-school").val() || "N/A",
                class: $("#reg-class").val() || "N/A",
                whatsapp: $("#reg-whatsapp").val() || "N/A",
                date: new Date().toLocaleString()
            };

            try {
                // Save to Firebase
                await addDoc(collection(db, "registrations"), userData);
                // Show the success feedback screen
                showScreen('success-screen');
            } catch (e) {
                console.error("Error adding document: ", e);
                // Fallback: Proceed anyway if firebase fails
                showScreen('success-screen');
            }
        }

        window.checkAccess = () => {
            window.location.href = "room.html";
        }

        window.adminLogin = async () => {
            const code = prompt("Enter Admin Passcode:");
            if(code === "decipher1234") {
                showScreen('admin-screen');
                const querySnapshot = await getDocs(collection(db, "registrations"));
                let html = "";
                querySnapshot.forEach((doc) => {
                    const user = doc.data();
                    html += `
                    <div class="bg-slate-900 p-4 rounded-xl border border-slate-800">
                        <div class="text-yellow-500 font-bold">${user.name}</div>
                        <div class="text-xs text-slate-400">Class: ${user.class} | School: ${user.school}</div>
                        <div class="text-xs text-blue-400 font-mono mt-1">WhatsApp: ${user.whatsapp}</div>
                        <div class="text-[9px] text-slate-600 mt-1">${user.date}</div>
                    </div>`;
                });
                $("#admin-list").html(html || "<p class='text-center'>No registrations found.</p>");
            } else if (code !== null) {
                alert("Access Denied.");
            }
        }
    </script>
</body>
</html>
